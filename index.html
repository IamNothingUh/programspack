<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Moved</title>
  <!-- Link pro framework 7.css -->
  <link rel="stylesheet" href="https://unpkg.com/7.css@latest/7.css">
</head>
<body>

  <h1>We moved our domain!</h1>
  <button id="goButton">Go</button>

  <script>
    // Fala a frase ao carregar
    window.addEventListener('load', () => {
      const msg = new SpeechSynthesisUtterance("We moved our domain!");
      window.speechSynthesis.speak(msg);
    });

    // Redireciona ao clicar
    document.getElementById('goButton').addEventListener('click', () => {
      window.location.href = "https://nothingsite.neocities.org/";
    });
  </script>

</body>
</html>
