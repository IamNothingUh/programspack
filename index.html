<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Guestbook Supabase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="font-family:Arial;background:#ddd;padding:20px;">

<h2>Guestbook Oficial</h2>

<form id="guestbookForm">
  <input type="text" id="name" placeholder="Seu Nome" required><br><br>
  <textarea id="message" placeholder="Sua Mensagem" required></textarea><br><br>
  <button type="submit" id="btnPost">Postar</button>
</form>

<p id="info" style="color:gray;font-size:12px;"></p>
<hr>
<div id="messages">Carregando mensagens...</div>

<script>
/* ===== CONFIG SUPABASE ===== */
const SUPABASE_URL = "COLE_AQUI_SUA_PROJECT_URL";
const SUPABASE_KEY = "COLE_AQUI_SUA_PUBLISHABLE_API_KEY"; // Chave 'anon'

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== CONFIG ENVIO ===== */
const EMAILS_ENABLED = false; // ← SE FALSO, NÃO ENVIA PARA O FORMSPREE
const FORMSPREE_URL = "https://formspree.io/f/xzddbakn";

/* ===== BUSCAR MENSAGENS DO BANCO ===== */
async function renderMessages() {
  const box = document.getElementById("messages");
  
  // Busca da sua tabela chamada 'database'
  const { data: msgs, error } = await supabase
    .from('database')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    box.innerHTML = "Erro ao carregar: " + error.message;
    return;
  }

  box.innerHTML = "";
  msgs.forEach(m => {
    const div = document.createElement("div");
    div.style.border = "1px solid #aaa";
    div.style.padding = "8px";
    div.style.marginBottom = "5px";
    div.style.background = "#fff";
    // Usando os campos 'name' e 'text' que você deve criar na tabela
    div.innerHTML = `<b>${m.name || 'Anônimo'}</b> <small>${new Date(m.created_at).toLocaleString()}</small><br>${m.text || m.message || ''}`;
    box.appendChild(div);
  });
}

/* ===== FORMULÁRIO ===== */
document.getElementById("guestbookForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnPost");
  const name = document.getElementById("name").value.trim();
  const text = document.getElementById("message").value.trim();

  btn.disabled = true;
  info.textContent = "Processando...";

  // 1. SALVA NO SUPABASE (Sempre)
  const { error } = await supabase
    .from('database')
    .insert([{ name: name, text: text }]);

  if (error) {
    alert("Erro ao salvar no banco: " + error.message);
    btn.disabled = false;
    return;
  }

  // 2. LOGICA TRUE/FALSE PARA E-MAIL
  if (EMAILS_ENABLED) {
    await fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, text })
    });
    info.textContent = "Postado e e-mail enviado!";
  } else {
    info.textContent = "Postado apenas no mural (E-mail desativado).";
  }

  document.getElementById("guestbookForm").reset();
  btn.disabled = false;
  renderMessages();
});

/* Inicializar */
renderMessages();
</script>
</body>
</html>
